name: Build MY IPTV Windows 11

on:
  push:
    branches: [main]
    paths:
      - 'MYIPTV-Windows11-Source*.zip'
      - '.github/workflows/build-windows.yml'
      - 'localization.js'
      - 'xtream-recent.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Windows project
        shell: pwsh
        run: |
          $archive = Get-ChildItem -File -Filter 'MYIPTV-Windows11-Source*.zip' | Select-Object -First 1
          if (-not $archive) {
            throw 'Upload MYIPTV-Windows11-Source.zip to the repository root before building.'
          }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath 'windows-project' -Force
          if (-not (Test-Path 'windows-project/package.json')) {
            throw 'ZIP must contain package.json at its root.'
          }

      - name: Add Arabic and English UI
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'localization.js' -Destination 'windows-project/localization.js'
          Copy-Item -LiteralPath 'xtream-recent.js' -Destination 'windows-project/xtream-recent.js'
          $html = Get-Content -Raw -Encoding UTF8 'windows-project/index.html'
          $html = $html.Replace('</body>', '<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script><script src="xtream-recent.js"></script><script src="localization.js"></script></body>')
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'windows-project/index.html'), $html, [System.Text.UTF8Encoding]::new($false))
          $package = Get-Content -Raw -Encoding UTF8 'windows-project/package.json'
          $package = $package.Replace('"index.html","assets/**/*"', '"index.html","localization.js","xtream-recent.js","assets/**/*"')
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'windows-project/package.json'), $package, [System.Text.UTF8Encoding]::new($false))

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: windows-project
        run: npm install --no-audit --no-fund

      - name: Build installer and portable EXE
        working-directory: windows-project
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: MY-IPTV-Windows11-Installers
          path: windows-project/dist/*.exe
          if-no-files-found: error
