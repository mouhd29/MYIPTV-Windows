name: Build MY IPTV Windows 11

on:
  push:
    branches: [main]
    paths:
      - 'MYIPTV-Windows11-Source.zip'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Windows project
        shell: pwsh
        run: |
          if (-not (Test-Path 'MYIPTV-Windows11-Source.zip')) {
            throw 'Upload MYIPTV-Windows11-Source.zip to the repository root before building.'
          }
          Expand-Archive -Path 'MYIPTV-Windows11-Source.zip' -DestinationPath 'windows-project' -Force
          if (-not (Test-Path 'windows-project/package.json')) {
            throw 'ZIP must contain package.json at its root.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: windows-project
        run: npm install --no-audit --no-fund

      - name: Build installer and portable EXE
        working-directory: windows-project
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: MY-IPTV-Windows11-Installers
          path: windows-project/dist/*.exe
          if-no-files-found: error
