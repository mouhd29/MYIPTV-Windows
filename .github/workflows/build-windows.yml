name: Build MY IPTV Windows 11

on:
  push:
    branches: [main]
    paths:
      - 'MYIPTV-Windows11-Source*.zip'
      - '.github/workflows/build-windows.yml'
      - 'localization.js'
      - 'xtream-recent.js'
      - 'premium-layout.css'
      - 'player-diagnostics.js'
      - 'fullscreen-player.js'
      - 'catalog-layout.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Windows project
        shell: pwsh
        run: |
          $archive = Get-ChildItem -File -Filter 'MYIPTV-Windows11-Source*.zip' | Select-Object -First 1
          if (-not $archive) {
            throw 'Upload MYIPTV-Windows11-Source.zip to the repository root before building.'
          }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath 'windows-project' -Force
          if (-not (Test-Path 'windows-project/package.json')) {
            throw 'ZIP must contain package.json at its root.'
          }

      - name: Add Arabic and English UI
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'localization.js' -Destination 'windows-project/localization.js'
          Copy-Item -LiteralPath 'xtream-recent.js' -Destination 'windows-project/xtream-recent.js'
          Copy-Item -LiteralPath 'premium-layout.css' -Destination 'windows-project/premium-layout.css'
          Copy-Item -LiteralPath 'player-diagnostics.js' -Destination 'windows-project/player-diagnostics.js'
          Copy-Item -LiteralPath 'fullscreen-player.js' -Destination 'windows-project/fullscreen-player.js'
          Copy-Item -LiteralPath 'catalog-layout.css' -Destination 'windows-project/catalog-layout.css'
          $html = Get-Content -Raw -Encoding UTF8 'windows-project/index.html'
          $html = $html.Replace('</head>', '<link rel="stylesheet" href="premium-layout.css"><link rel="stylesheet" href="catalog-layout.css"></head>')
          $html = $html.Replace('</body>', '<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script><script src="xtream-recent.js"></script><script src="player-diagnostics.js"></script><script src="fullscreen-player.js"></script><script src="localization.js"></script></body>')
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'windows-project/index.html'), $html, [System.Text.UTF8Encoding]::new($false))
          $package = Get-Content -Raw -Encoding UTF8 'windows-project/package.json'
          $package = $package.Replace('"index.html","assets/**/*"', '"index.html","localization.js","xtream-recent.js","premium-layout.css","player-diagnostics.js","fullscreen-player.js","catalog-layout.css","assets/**/*"')
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'windows-project/package.json'), $package, [System.Text.UTF8Encoding]::new($false))

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: windows-project
        run: npm install --no-audit --no-fund

      - name: Build installer and portable EXE
        working-directory: windows-project
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: MY-IPTV-Windows11-Installers
          path: windows-project/dist/*.exe
          if-no-files-found: error

      - name: Publish Windows beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-beta-latest
          name: MY IPTV Windows 11 Beta
          prerelease: true
          make_latest: false
          files: windows-project/dist/*.exe
          fail_on_unmatched_files: true
