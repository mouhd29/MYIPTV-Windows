<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src * data: blob:; connect-src *;">
<title>MY IPTV — Windows 11</title>
<style>
:root{font-family:Inter,'Segoe UI',Arial,sans-serif;color:#f5f7ff;background:#090b14;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#101320;border-right:1px solid #252a3e;padding:20px 15px;display:flex;flex-direction:column;gap:7px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px}.brand img{width:76px;height:66px;object-fit:contain}.brand strong{font-size:18px;letter-spacing:.5px}.brand small{display:block;color:#8d95b2;font-size:11px;margin-top:3px}
.nav{border:0;background:transparent;color:#a9b1ca;text-align:left;padding:14px 15px;border-radius:12px;font-weight:600}.nav.active,.nav:hover{background:linear-gradient(100deg,#302273,#1a234a);color:white}
.foot{margin-top:auto;padding:14px 9px;color:#8f98b5;font-size:12px;line-height:1.7}.main{padding:25px 30px 50px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.top h1{margin:0;font-size:25px}.sub{color:#929bb8;font-size:13px;margin-top:6px}
.search{background:#161a2b;border:1px solid #33394f;color:#fff;border-radius:12px;padding:13px 15px;width:300px;outline:none}.search:focus{border-color:#8761ff}
.hero{margin-top:26px;min-height:210px;border:1px solid #41327e;border-radius:19px;background:radial-gradient(circle at 80% 20%,#4737aa,#1c1943 47%,#12172b);display:flex;justify-content:space-between;align-items:center;padding:25px 38px;overflow:hidden}
.hero h2{font-size:30px;margin:0 0 10px}.hero p{color:#b7bee0;max-width:440px;line-height:1.6}.hero img{width:190px;height:170px;object-fit:contain;filter:drop-shadow(0 12px 24px #0008)}
.btn{border:0;border-radius:11px;padding:11px 16px;background:#7249e9;color:#fff;font-weight:700}.btn:hover{background:#8968ff}.btn.ghost{background:#242a40}.btn.red{background:#743347}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:25px 0 15px;gap:15px;flex-wrap:wrap}.toolbar h2{margin:0;font-size:19px}.filters{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #34394f;border-radius:25px;background:#181c2c;color:#bfc6dd;padding:9px 14px}.chip.selected{background:#6743d5;color:white;border-color:#6743d5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.tile{border:1px solid #272e44;border-radius:15px;background:#141829;padding:17px;min-height:160px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}.tile:hover{border-color:#7852e9;background:#1b1c34}
.thumb{height:55px;width:55px;border-radius:14px;background:linear-gradient(135deg,#34206e,#1d5594);display:flex;align-items:center;justify-content:center;font-size:27px;overflow:hidden}.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cat{color:#919ab5;font-size:12px;margin-top:5px}.actions{display:flex;gap:8px}.actions button{border:0;border-radius:9px;padding:9px 11px;color:white;background:#302954}.actions button:first-child{flex:1;background:#5d3ec3}
.empty{border:1px dashed #38405d;border-radius:15px;padding:45px 20px;color:#a9b1ce;text-align:center;line-height:1.8}.panel{margin-top:24px;border:1px solid #31364c;background:#141829;padding:22px;border-radius:17px;max-width:800px}
.panel h2{margin-top:0}.field{width:100%;border:1px solid #3a425e;border-radius:10px;background:#0c1020;color:white;padding:13px;margin:10px 0 14px;outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hint{color:#a2abc6;font-size:12px;line-height:1.6}
.player{position:fixed;inset:0;background:#02030aec;display:none;z-index:10;align-items:center;justify-content:center;padding:35px}.player.show{display:flex}
.playerbox{background:#101322;border:1px solid #373c59;border-radius:18px;overflow:hidden;width:min(100%,1080px)}.playerhead{display:flex;align-items:center;justify-content:space-between;padding:13px 19px}.playerhead strong{max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
video{display:block;width:100%;background:#000;aspect-ratio:16/9;max-height:72vh}.notice{color:#b7bfd6;padding:12px 18px;font-size:12px}.status{margin-top:10px;color:#c1b3ff;font-size:12px}
@media(max-width:850px){.app{grid-template-columns:75px 1fr}.side{padding:14px 8px}.brand{padding:0 0 20px;justify-content:center}.brand img{width:57px}.brand div,.nav .word,.foot{display:none}.nav{text-align:center;font-size:21px}.main{padding:18px}.hero{padding:18px}.hero img{width:100px}.hero h2{font-size:22px}.search{width:180px}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand"><img src="assets/logo.png"><div><strong>MY IPTV</strong><small>WINDOWS EDITION</small></div></div>
<button class="nav active" data-page="home">⌂ <span class="word"> &nbsp; Home</span></button>
<button class="nav" data-page="live">▣ <span class="word"> &nbsp; Live TV</span></button>
<button class="nav" data-page="movies">▤ <span class="word"> &nbsp; Movies</span></button>
<button class="nav" data-page="series">▦ <span class="word"> &nbsp; Series</span></button>
<button class="nav" data-page="favorites">★ <span class="word"> &nbsp; Favorites</span></button>
<button class="nav" data-page="playlists">☷ <span class="word"> &nbsp; Playlists</span></button>
<button class="nav" data-page="settings">⚙ <span class="word"> &nbsp; Settings</span></button>
<div class="foot">MY IPTV • Player only<br>No channels included<br>Use authorized playlists.</div></aside>
<main class="main"><div class="top"><div><h1 id="heading">Welcome to MY IPTV</h1><div class="sub" id="subtitle">Your entertainment, your playlist.</div></div><input class="search" id="search" placeholder="Search channels and titles…"></div>
<div id="content"></div></main></div>
<div class="player" id="player"><div class="playerbox"><div class="playerhead"><strong id="playing">Playing</strong><button class="btn ghost" id="close">✕ Close</button></div><video id="video" controls autoplay playsinline></video><div class="notice" id="playnotice">Playback depends on source format and stream permissions.</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='home',category='All',query='',hls=null;
let playlists=JSON.parse(localStorage.getItem('myiptv_playlists')||'[]'),selected=localStorage.getItem('myiptv_selected')||'',favorites=JSON.parse(localStorage.getItem('myiptv_favs')||'[]');
const save=()=>{localStorage.setItem('myiptv_playlists',JSON.stringify(playlists));localStorage.setItem('myiptv_selected',selected);localStorage.setItem('myiptv_favs',JSON.stringify(favorites))};
const current=()=>playlists.find(p=>p.id===selected)||playlists[0];
function parseM3U(raw){let entries=[],pending=null;for(const line of raw.replace(/\r/g,'').split('\n')){let s=line.trim();if(s.startsWith('#EXTINF:')){const attr=(k)=>{let m=s.match(new RegExp(k+'="([^"]*)"','i'));return m?m[1]:''};pending={name:(s.slice(s.lastIndexOf(',')+1).trim()||'Unnamed channel'),category:attr('group-title')||'Uncategorized',logo:attr('tvg-logo')||'',type:attr('group-title').toLowerCase().includes('movie')?'movies':attr('group-title').toLowerCase().includes('series')?'series':'live'};}else if(s&&!s.startsWith('#')&&pending){if(/^https?:\/\//i.test(s)){entries.push({...pending,url:s,id:s});}pending=null;}}return entries}
function go(p){page=p;category='All';query='';$('search').value='';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page));
$('search').oninput=e=>{query=e.target.value.toLowerCase();render()};
function play(url,name){$('playing').textContent=name;$('player').classList.add('show');let v=$('video');v.pause();v.removeAttribute('src');v.load();if(hls){hls.destroy();hls=null}const isHls=/\.m3u8(?:[?#]|$)/i.test(url);$('playnotice').textContent='If playback fails, the stream may need unsupported codecs, authentication, or custom headers.';if(isHls&&v.canPlayType('application/vnd.apple.mpegurl'))v.src=url;else if(isHls&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)$('playnotice').textContent='Playback error: '+d.details})}else v.src=url;v.play().catch(()=>{})}
$('close').onclick=()=>{let v=$('video');v.pause();v.removeAttribute('src');v.load();if(hls){hls.destroy();hls=null}$('player').classList.remove('show')};
document.onkeydown=e=>{if(e.key==='Escape'&&$('player').classList.contains('show'))$('close').click()};
function render(){const c=$('content'),pl=current(),items=pl?.entries||[];const headings={home:'Welcome to MY IPTV',live:'Live TV',movies:'Movies',series:'Series',favorites:'My Favorites',playlists:'Manage Playlists',settings:'Settings'};$('heading').textContent=headings[page];$('subtitle').textContent=pl?`${pl.name} • ${items.length} entries`:'Your entertainment, your playlist.';
if(page==='playlists'){c.innerHTML=`<div class="panel"><h2>Add your playlist</h2><p class="hint">Paste an M3U playlist URL or import an M3U file. No streams or subscriptions are provided by MY IPTV.</p><label>Playlist name</label><input class="field" id="pname" placeholder="My Playlist"><label>Playlist URL (M3U)</label><input class="field" id="purl" placeholder="https://example.com/playlist.m3u"><div class="row"><button class="btn" id="addurl">Import URL</button><label class="btn ghost" style="cursor:pointer">Import local M3U file<input type="file" id="pfile" accept=".m3u,.m3u8,text/plain" style="display:none"></label></div><div class="status" id="importstatus"></div></div><div class="toolbar"><h2>Saved playlists</h2></div><div class="grid">${playlists.map(p=>`<div class="tile"><div><div class="name">${esc(p.name)}</div><div class="cat">${p.entries.length} items ${p.id===selected?'• Active':''}</div></div><div class="actions"><button data-select="${esc(p.id)}">Open</button><button data-delete="${esc(p.id)}">Delete</button></div></div>`).join('')}</div>`;
$('addurl').onclick=async()=>{let url=$('purl').value.trim(),name=$('pname').value.trim()||'My Playlist';if(!/^https?:\/\//.test(url))return $('importstatus').textContent='Enter a valid http(s) URL.';$('importstatus').textContent='Fetching playlist…';try{let res=await fetch(url);if(!res.ok)throw Error('HTTP '+res.status);addPlaylist(name,parseM3U(await res.text()));}catch(e){$('importstatus').textContent='Import failed: '+e.message+'. Try downloading and importing the M3U file locally (CORS restrictions may apply).'}};
$('pfile').onchange=async e=>{let file=e.target.files[0];if(file)addPlaylist($('pname').value.trim()||file.name,parseM3U(await file.text()))};
c.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;save();go('live')});c.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Remove playlist?')){playlists=playlists.filter(p=>p.id!==b.dataset.delete);if(selected===b.dataset.delete)selected=playlists[0]?.id||'';save();render()}});return}
if(page==='settings'){c.innerHTML=`<div class="panel"><h2>MY IPTV for Windows 11</h2><p>Version 0.1.0 • Desktop Beta</p><p class="hint">Player-only application. Bring your own legally authorized M3U playlists. No IPTV service, content, or subscription is included.</p><button class="btn ghost" id="clearfav">Clear favorites</button></div>`;$('clearfav').onclick=()=>{favorites=[];save();render()};return}
if(page==='home'){c.innerHTML=`<div class="hero"><div><h2>Welcome to MY IPTV</h2><p>Experience your playlists on Windows 11 with an elegant TV-inspired interface. Browse live channels, find favorites, and play supported streams.</p><button class="btn" id="heroaction">${pl?'Browse Live TV':'Add Playlist'}</button></div><img src="assets/logo.png" alt="MY IPTV logo"></div><div class="toolbar"><h2>${pl?'Your channels':'Getting started'}</h2></div><div id="homeitems"></div>`;$('heroaction').onclick=()=>go(pl?'live':'playlists');if(!pl){$('homeitems').innerHTML='<div class="empty">No playlist added yet.<br>Go to Playlists and import an M3U URL or file.</div>';return}}
let filtered=items.filter(i=>(page==='home'||page==='favorites'||i.type===page)&&(!query||(i.name+' '+i.category).toLowerCase().includes(query))&&(page!=='favorites'||favorites.includes(i.id)));
let cats=['All',...new Set(filtered.map(i=>i.category))];if(category!=='All'&&!cats.includes(category))category='All';
const host=page==='home'?$('homeitems'):c;
let list=filtered.filter(i=>category==='All'||i.category===category).slice(0,500);
host.innerHTML=`<div class="filters">${cats.slice(0,30).map(x=>`<button class="chip ${x===category?'selected':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="toolbar"><h2>${list.length} ${page==='movies'?'movies':page==='series'?'series':'channels / entries'}</h2><span class="hint">Showing up to 500 results</span></div>${list.length?`<div class="grid">${list.map(i=>`<div class="tile"><div class="thumb">${i.logo?`<img src="${esc(i.logo)}" onerror="this.style.display='none'">`:'▶'}</div><div><div class="name" title="${esc(i.name)}">${esc(i.name)}</div><div class="cat">${esc(i.category)}</div></div><div class="actions"><button data-play="${esc(i.id)}">▶ Play</button><button data-fav="${esc(i.id)}">${favorites.includes(i.id)?'★':'☆'}</button></div></div>`).join('')}</div>`:'<div class="empty">No items here yet. Add a playlist or try another category.</div>'}`;
host.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()});host.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{let item=items.find(i=>i.id===b.dataset.play);if(item)play(item.url,item.name)});host.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let id=b.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render()});
}
function addPlaylist(name,entries){if(!entries.length)return $('importstatus').textContent='No playable HTTP(S) entries found in this M3U file.';let id=String(Date.now());playlists.push({id,name,entries});selected=id;save();go('live')}
render();
</script></body></html>
